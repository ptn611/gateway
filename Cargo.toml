[package]
name = "velocity-gateway"
version = "1.5.5"
edition = "2021"

[dependencies]
actix-web = "*"
argh = "*"
velocity-rs = { git = "https://github.com/velocity-exchange/velocity-v1", rev = "c9819d0", features = ["titan"] }
base64 = "0.22.1"
env_logger = "*"
faster-hex = "0.10.0"
futures-util = "*"
log = "*"
nanoid = "0.4.0"
reqwest = { version = "*", features = ["json"] }
rust_decimal = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
sha256 = "1.6.0"
solana-account-decoder-client-types = "3"
solana-rpc-client-api = "3"
solana-transaction-status = "3"
thiserror = "*"
tokio = {version ="*", features = ["full"]}
tokio-tungstenite = "*"

[profile.release]
# NB: do not set `panic = 'abort'` here. actix-web isolates a panicking request
# handler and returns 500; aborting turns any such panic into a process-wide
# outage, taking every other in-flight request and subscription down with it.
