name: Build

on:
  push:
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - ".github/workflows/*.yml"
  pull_request:
    branches:
      - master
    paths:
      - "**.rs"
      - "**.toml"
      - "**.lock"
      - ".github/workflows/*.yml"

jobs:
  format-build-test:
    runs-on: ubicloud
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Check out drift-ffi-sys (sibling, built from source by drift-rs build.rs)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/drift-ffi-sys
          path: drift-ffi-sys

      - name: Check out protocol-v2 (dep of drift-ffi-sys)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/protocol-v2
          path: protocol-v2

      - name: Check out drift-rs (path dep)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ptn611/drift-rs
          path: drift-rs

      - name: Config rust toolchain
        run: |
          rustup update stable && rustup default stable
          rustup show active-toolchain
      - name: Format
        run: cargo fmt --all -- --check
      - uses: ubicloud/rust-cache@65b3ff06b9bcc69d88c25e212f1ae3d14a0953c3 # v2
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: |
          cargo -V
          cargo check
      - name: Test
        env:
          DRIFT_GATEWAY_KEY: ${{ secrets.DRIFT_GATEWAY_KEY }}
          TEST_DELEGATED_SIGNER: ${{ secrets.TEST_DELEGATED_SIGNER }}
          TEST_RPC_ENDPOINT: ${{ secrets.DEVNET_RPC_ENDPOINT }}
          TEST_MAINNET_RPC_ENDPOINT: ${{ secrets.MAINNET_RPC_ENDPOINT }}

        # --test-threads, limit parallelism to prevent hitting RPC rate-limits
        run: |
          cargo -V
          cp ../drift-ffi-sys/target/debug/libdrift_ffi_sys.so ./target/debug/deps
          cargo test --all -- --test-threads=2
